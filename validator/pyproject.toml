[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oiss-validate"
version = "0.1.0"
description = "Validator for Open Intelligent Store Specification (OISS) records"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18", "referencing>=0.30"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
oiss-validate = "oiss_validate.cli:main"

[tool.setuptools]
packages = ["oiss_validate"]
