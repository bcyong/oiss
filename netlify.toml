# Netlify reads this file when the repository is linked as a Netlify project.
# Every push to main deploys to production, and every pull request gets a
# deploy preview. See docs/deploy-netlify.md.

[build]
  # Generate the golden day of synthetic OISS records, then build the web app.
  command = "npm run build:web"
  publish = "web/dist"

[build.environment]
  # The simulator runs TypeScript directly, which needs Node 22.18 or later.
  NODE_VERSION = "22"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

