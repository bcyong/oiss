name: Assistant answer check

# Asks the Store Operations Assistant its sample questions at 9 AM, 1 PM and 6 PM on the golden day and
# checks each answer against the records its tools returned: citations, numbers, causes, team names and
# claims to have raised a task. About 35 calls to the NVIDIA-hosted models, plus a safety check on each
# question and answer. It reports; it doesn't block a merge unless the repository's
# branch protection is set to require it.

on:
  pull_request:
    paths:
      - "web/src/assistant/**"
      - "web/eval/**"
      - "netlify/functions/**"
      - "sim/src/**"
      - ".github/workflows/assistant-eval.yml"
  workflow_dispatch:
  schedule:
    # Mondays at 14:00 UTC, so a model change on NVIDIA's side shows up within a week.
    - cron: "0 14 * * 1"

permissions:
  contents: read

concurrency:
  group: assistant-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  answers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ask and check
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          NVIDIA_ROUTER_MODEL: ${{ vars.NVIDIA_ROUTER_MODEL }}
          NVIDIA_SAFETY_MODEL: ${{ vars.NVIDIA_SAFETY_MODEL }}
        run: npm run eval:assistant -w web
