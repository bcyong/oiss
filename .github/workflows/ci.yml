name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the validator
        run: pip install -e "validator[test]"
      - name: Check that the schemas are valid JSON Schema
        run: |
          python - <<'PY'
          import json, pathlib
          from jsonschema import Draft202012Validator
          for path in sorted(pathlib.Path("schemas").rglob("*.schema.json")):
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              print("ok", path)
          PY
      - name: Released schema versions are frozen
        # Once a version is tagged, its schema folder must match the tag exactly.
        run: |
          for v in $(jq -r '.versions[].version' schemas/versions.json); do
            if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              git diff --exit-code "v$v" -- "schemas/v$v" && echo "ok v$v matches its tag"
            else
              echo "v$v has no tag yet"
            fi
          done
      - name: Valid examples pass
        run: oiss-validate examples/valid examples/older
      - name: Valid examples pass as a reader
        run: oiss-validate --reader examples/valid examples/older
      - name: Invalid examples fail
        run: "! oiss-validate -q examples/invalid"
      - name: Tests
        run: pytest validator/tests

  demo:
    # The same build Netlify runs, plus the simulator's tests and a check that every
    # generated record is valid OISS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Simulator tests
        run: npm test
      - name: Golden day matches its manifest
        run: npm run golden:check
      - name: Build the site
        run: npm run build:web
      - name: Every generated record is valid OISS
        run: |
          pip install -e validator
          oiss-validate -q web/public/data/demo-001/2026-11-17/store-layout.json web/public/data/demo-001/2026-11-17/*.jsonl
