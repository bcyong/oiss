<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" role="img" aria-labelledby="oiss-fig-title" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title id="oiss-fig-title">Each vendor feeds one shared store record that agents turn into tasks</title>
  <style>
